server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to backend
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # No explicit timeouts here previously meant nginx's default 60s
    # applied to /api/migration/select-schemas, which loads EVERY view
    # from the selected schema(s) into the Lakehouse before responding.
    # That routinely runs well past 60s, so nginx was killing the
    # connection (504) out from under an otherwise-successful backend
    # request. Set high enough to be effectively unlimited for this flow.
    proxy_connect_timeout 3600s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
  }
}